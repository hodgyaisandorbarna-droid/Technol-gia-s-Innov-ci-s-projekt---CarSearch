<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarSearch admin – ajánlatkérések</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body class="admin">
  <header class="top">
    <a href="./" class="brand">CarSearch <span>admin</span></a>
    <nav aria-label="Navigáció"><a href="./">Vissza az oldalra</a></nav>
  </header>

  <main id="main">
    <div class="adm-head">
      <h1>Ajánlatkérések</h1>
      <div class="filters" id="statusFilter" role="group" aria-label="Szűrés állapot szerint"></div>
    </div>

    <div class="adm" id="adm">
      <section class="adm-list" aria-label="Kérések listája">
        <ul id="reqList"></ul>
        <div id="emptyState" class="empty" hidden>
          <h2>Még nincs ajánlatkérés</h2>
          <p>Amikor valaki az oldalon az „Ezt kérem” gombbal elküldi az adatait, a kérés itt jelenik meg.</p>
          <div><button type="button" id="seed" class="quiet">Mintakérés hozzáadása</button></div>
        </div>
      </section>
      <section class="adm-detail" id="detail" aria-live="polite"></section>
    </div>

    <p class="hint adm-note">Prototípus: a kérések ennek a böngészőnek a helyi tárolójában vannak, belépés és valódi e-mail-küldés még nincs.</p>
  </main>

  <script type="module" src="src/admin.js"></script>
</body>
</html>
